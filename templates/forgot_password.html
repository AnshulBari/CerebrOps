<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — CerebrOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="auth-brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/img/logo.svg" alt="" width="26" height="26">
      </span>
      CerebrOps
    </a>

    <h1 class="auth-title">Lost your <span class="serif-it" style="color:var(--accent-strong)">keys?</span></h1>
    <p class="auth-sub">Enter your account email and we'll issue a single-use reset link. It expires in 30 minutes.</p>

    {% if message %}
    <div class="auth-note" role="status">
      <span class="mono" style="font-size:12px">{{ message }}</span>
    </div>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('forgot_password') }}">
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" id="email" name="email" type="email" placeholder="you@company.dev" required autocomplete="email" autofocus>
      </div>
      <button class="auth-submit" type="submit">Send reset link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="{{ url_for('login') }}">Sign in</a></p>

    <p class="auth-foot">
      <a href="/">← back to cerebrops</a>
    </p>
  </main>
</body>
</html>
