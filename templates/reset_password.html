<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — CerebrOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="auth-brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <img src="/static/img/logo.svg" alt="" width="26" height="26">
      </span>
      CerebrOps
    </a>

    <h1 class="auth-title">Set a new <span class="serif-it" style="color:var(--accent-strong)">password.</span></h1>
    <p class="auth-sub">Eight characters minimum. Don't reuse your last one.</p>

    {% if error %}
    <div class="auth-error" role="alert">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('reset_password', token=token) }}">
      <div class="auth-field">
        <label for="password">New password</label>
        <input class="auth-input" id="password" name="password" type="password" placeholder="••••••••••••" required autocomplete="new-password" autofocus minlength="8">
      </div>
      <button class="auth-submit" type="submit">Save new password</button>
    </form>

    <p class="auth-switch">Changed your mind? <a href="{{ url_for('login') }}">Sign in instead</a></p>

    <p class="auth-foot">
      <a href="/">← back to cerebrops</a>
    </p>
  </main>
</body>
</html>
