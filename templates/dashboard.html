<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-key" content="{{ api_key }}">
  <title>CerebrOps — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="side-brand" href="/" title="Back to cerebrops home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
        </span>
        <span class="side-brand-name">CerebrOps</span>
        <span class="side-env chip" id="side-env">prod</span>
      </a>

      <nav class="side-nav" id="side-nav">
        <p class="side-label">Workspace</p>
        <a class="side-link active" href="#/overview" data-route="overview">
          <span>Overview</span>
        </a>
        <a class="side-link" href="#/pipelines" data-route="pipelines">
          <span>Pipelines</span>
        </a>
        <a class="side-link" href="#/deployments" data-route="deployments">
          <span>Deployments</span>
        </a>
        <a class="side-link" href="#/anomalies" data-route="anomalies">
          <span>Anomalies</span>
        </a>
        <a class="side-link" href="#/alerts" data-route="alerts">
          <span>Alerts</span>
          <span class="side-count" id="alert-count" hidden></span>
        </a>

        <p class="side-label">Manage</p>
        <a class="side-link" href="#/environments" data-route="environments">
          <span>Environments</span>
        </a>
        <a class="side-link" href="#/analytics" data-route="analytics">
          <span>Analytics</span>
        </a>
        <a class="side-link" href="#/settings" data-route="settings">
          <span>Settings</span>
        </a>
      </nav>

      <div class="side-foot">
        <div class="side-status">
          <span class="dot dot-success" id="side-dot"></span>
          <span id="side-status-text" class="mono">system · healthy</span>
        </div>
        <button class="side-collapse" id="side-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
        </button>
      </div>
    </aside>
    <div class="side-scrim" id="side-scrim" hidden></div>

    <!-- ============ MAIN ============ -->
    <div class="app-main">
      <header class="topbar">
        <button class="icon-btn hamburger" id="hamburger" aria-label="Open navigation" aria-expanded="false">
        </button>
        <div class="crumb" id="crumb">
          <span class="crumb-sep mono">~/</span><span id="crumb-name">overview</span>
        </div>

        <div class="topbar-right">
          <button class="search-trigger" id="search-trigger" aria-label="Search (Ctrl K)">
            <span class="search-label">Search…</span>
            <span class="kbd" id="search-kbd">⌘K</span>
          </button>
          <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme">
          </button>
          <div class="notif-wrap">
            <button class="icon-btn" id="notif-btn" aria-label="Notifications" aria-expanded="false">
              <span class="notif-badge" id="notif-badge" hidden></span>
            </button>
            <div class="notif-panel" id="notif-panel" hidden></div>
          </div>
          <div class="user-chip" id="user-chip" title="{{ user_name or 'operator' }}">
            <span class="avatar mono">{{ user_initials or 'op' }}</span>
            <span class="user-name">{{ user_name or 'operator' }}</span>
          </div>
          <a class="icon-btn" href="/logout" title="Log out" aria-label="Log out">
          </a>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <a class="tab-item active" href="#/overview" data-route="overview" aria-label="Overview">
      <span>Home</span>
    </a>
    <a class="tab-item" href="#/pipelines" data-route="pipelines" aria-label="Pipelines">
      <span>Pipelines</span>
    </a>
    <button class="tab-fab" id="tab-run" aria-label="Run pipeline" title="Run pipeline">
    </button>
    <a class="tab-item" href="#/deployments" data-route="deployments" aria-label="Deployments">
      <span>Deploys</span>
    </a>
    <a class="tab-item" href="#/alerts" data-route="alerts" aria-label="Alerts">
      <span>Alerts</span>
    </a>
  </nav>

  <!-- ============ COMMAND PALETTE ============ -->
  <div class="palette-backdrop" id="palette-backdrop" hidden>
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input-row">
        <input class="palette-input" id="palette-input" type="text" placeholder="Search projects, runs, actions…" autocomplete="off" spellcheck="false" aria-label="Search">
        <span class="kbd">esc</span>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="palette-foot">
        <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
        <span><span class="kbd">↵</span> select</span>
        <span class="palette-hint mono">actions</span>
      </div>
    </div>
  </div>

  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <script id="initial-data" type="application/json">{{ initial_data | safe }}</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
