<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — CerebrOps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="auth-brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" width="26" height="26">
          <rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 12h2.2l1.2-3 2.2 6 1.4-3H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      CerebrOps
    </a>

    <h1 class="auth-title">Start <span class="serif-it" style="color:var(--accent-strong)">watching.</span></h1>
    <p class="auth-sub">Every commit, one webhook away from a live record of your deploys.</p>

    <form class="auth-form" method="post" action="{{ url_for('register') }}">
      {% if error %}
      <div class="auth-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}
      <div class="auth-field">
        <label for="name">Name</label>
        <input class="auth-input" id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" id="email" name="email" type="email" placeholder="you@company.dev" required autocomplete="email" autofocus>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input class="auth-input" id="password" name="password" type="password" placeholder="at least 8 characters" required autocomplete="new-password">
      </div>
      <button class="auth-submit" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    <p class="auth-demo">Runs entirely in your cluster. Telemetry never leaves it.</p>

    <p class="auth-foot">
      <a href="/">← back to cerebrops</a>
    </p>
  </main>
</body>
</html>
