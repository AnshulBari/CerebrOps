apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
# Staging environment: production-like enough to catch regressions before main
# reaches prod. Image digest is set by the promote workflow.
resources:
- ../../base
patches:
- target:
    kind: Namespace
  patch: |-
    - op: replace
      path: /metadata/name
      value: staging
- target:
    kind: Deployment
    name: cerebrops-app
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: Ingress
    name: cerebrops-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: staging.cerebrops.example.com
    - op: replace
      path: /spec/tls/0/hosts/0
      value: staging.cerebrops.example.com
- target:
    kind: CronJob
    name: cerebrops-anomaly-detection
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/command/4
      value: http://cerebrops-service.staging.svc.cluster.local
images:
- name: ghcr.io/anshulbari/cerebrops
  newTag: latest
