apiVersion: v1
kind: Secret
metadata:
  name: cerebrops-secrets
  namespace: cerebrops
type: Opaque
# Data is injected by CI/CD pipeline or deploy.sh script.
# Do NOT commit actual secret values to this file.
# secret-key signs dashboard sessions (required in prod: the app refuses to
# start with the public dev fallback). Generate once with:
#   python -c "import secrets; print(secrets.token_hex(32))"
# Create secrets manually:
#   kubectl create secret generic cerebrops-secrets \
#     --from-literal=secret-key="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=slack-webhook-url="YOUR_URL" \
#     -n cerebrops
data:
  secret-key: ""
  slack-webhook-url: ""

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerebrops-config
  namespace: cerebrops
data:
  app.conf: |
    [monitoring]
    check_interval = 60
    anomaly_threshold = 0.1

    [elasticsearch]
    host = elasticsearch.default.svc.cluster.local
    port = 9200

    [logging]
    level = INFO
    format = "%(asctime)s %(levelname)s %(name)s %(message)s"
