apiVersion: v1
kind: ServiceAccount
metadata:
  name: cerebrops-deployer
  namespace: cerebrops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cerebrops-deployer-role
  namespace: cerebrops
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  verbs: ["get"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "pods", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cerebrops-deployer-binding
  namespace: cerebrops
subjects:
- kind: ServiceAccount
  name: cerebrops-deployer
  namespace: cerebrops
roleRef:
  kind: Role
  name: cerebrops-deployer-role
  apiGroup: rbac.authorization.k8s.io
