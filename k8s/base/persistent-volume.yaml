apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerebrops-logs-pvc
  namespace: cerebrops
  labels:
    app: cerebrops
spec:
  # ReadWriteMany is required: the web Deployment (2 replicas) and the
  # anomaly-detection CronJob all mount this volume simultaneously.
  # Use a RWX-capable storage class (e.g. Longhorn, NFS, EFS, azurefile).
  # If your cluster only offers RWO, reduce the Deployment replicas to 1.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard  # Adjust based on your cluster

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerebrops-data-pvc
  namespace: cerebrops
  labels:
    app: cerebrops
spec:
  # ReadWriteMany: hosts the shared SQLite metrics store (cerebrops.db) and
  # the persisted model files (models/ subPath), mounted by both web replicas
  # and the anomaly-detection CronJob.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard  # Adjust based on your cluster
