apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerebrops-app
  namespace: cerebrops
  labels:
    app: cerebrops
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cerebrops
      component: web
  template:
    metadata:
      labels:
        app: cerebrops
        component: web
        app.kubernetes.io/name: cerebrops-app
        app.kubernetes.io/instance: cerebrops-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cerebrops-web
        image: ghcr.io/anshulbari/cerebrops:main
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_ENV
          value: "production"
        - name: CEREBROPS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cerebrops-secrets
              key: secret-key
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: cerebrops-secrets
              key: slack-webhook-url
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: cerebrops-logs-pvc
      - name: data
        persistentVolumeClaim:
          claimName: cerebrops-data-pvc
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cerebrops-service
  namespace: cerebrops
  labels:
    app: cerebrops
    component: web
spec:
  selector:
    app: cerebrops
    component: web
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  type: ClusterIP

---
# NOTE: replace "cerebrops.example.com" with your real domain. cert-manager
# must be installed and the ClusterIssuer in k8s/cert-manager.yaml applied
# before TLS will issue.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cerebrops-ingress
  namespace: cerebrops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - cerebrops.example.com
    secretName: cerebrops-tls
  rules:
  - host: cerebrops.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cerebrops-service
            port:
              number: 80
