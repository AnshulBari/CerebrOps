# Requires the External Secrets Operator (https://external-secrets.io).
# Install it first, then set the store credentials; this replaces the
# manually-created cerebrops-secrets Secret from secrets.yaml.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cerebrops-externalsecret
  namespace: cerebrops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cerebrops-secret-store
    kind: SecretStore
  target:
    name: cerebrops-secrets
    creationPolicy: Owner
  data:
  - secretKey: slack-webhook-url
    remoteRef:
      key: cerebrops/slack-webhook-url
---
# Example SecretStore backed by AWS Secrets Manager. Adapt the provider to
# your cloud (GCP Secret Manager, Azure Key Vault, HashiCorp Vault, ...).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: cerebrops-secret-store
  namespace: cerebrops
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: cerebrops-deployer
