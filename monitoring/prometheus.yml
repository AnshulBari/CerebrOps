global:
  scrape_interval: 15s
  evaluation_interval: 15s

# SLO recording rules + burn-rate/operational alerts.
rule_files:
- /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: 'cerebrops'
    metrics_path: '/metrics-prom'
    static_configs:
      - targets: ['app:5000']
        labels:
          application: 'cerebrops'
          environment: 'development'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
