# ArgoCD Application for the staging environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cerebrops-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/anshulbari/cerebrops.git
    targetRevision: main
    path: k8s/overlays/staging
    kustomize:
      images:
      - ghcr.io/anshulbari/cerebrops:main
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
