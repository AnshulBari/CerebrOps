# CerebrOps Standalone ELK Stack
#
# Elasticsearch + Logstash + Kibana + Filebeat. Filebeat reads Docker
# container logs (including the CerebrOps app container) and ships them via
# Logstash to Elasticsearch.
#
# Security is DISABLED for local/development use (ES 8.x will not boot with
# security enabled unless transport TLS + users are provisioned). For a
# secured production deployment, enable xpack.security and provision
# certificates/passwords explicitly.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: cerebrops-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=cerebrops-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:8.9.0
    container_name: cerebrops-logstash
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/templates:/usr/share/logstash/templates:ro
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx512m -Xms512m"
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.9.0
    container_name: cerebrops-kibana
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.9.0
    container_name: cerebrops-filebeat
    user: root
    volumes:
      - ./filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - elk-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_healthy

  kibana-setup:
    image: curlimages/curl:8.5.0
    container_name: cerebrops-kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kibana...";
        until curl -sf http://kibana:5601/api/status >/dev/null 2>&1; do sleep 3; done;
        echo "Creating data view cerebrops-logs-* ...";
        curl -sf -X POST http://kibana:5601/api/data_views/data_view \
          -H 'Content-Type: application/json' -H 'kbn-xsrf: true' \
          -d '{"data_view":{"title":"cerebrops-logs-*","name":"cerebrops-logs","timeFieldName":"@timestamp"}}' \
          >/dev/null && echo "Data view created" || echo "Data view creation skipped (may already exist)";
        echo "Kibana setup complete."
    networks:
      - elk-network
    restart: "no"

volumes:
  elasticsearch_data:
    driver: local

networks:
  elk-network:
    driver: bridge
