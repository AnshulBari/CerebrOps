cluster.name: "cerebrops-cluster"
network.host: 0.0.0.0
discovery.type: single-node

# Security is DISABLED for the local/dev stack.
# ES 8.x requires transport TLS when security is enabled, so the previous
# combination (xpack.security.enabled: true + transport ssl disabled) would
# not boot. For a secured production cluster, enable security and provision
# certificates/passwords explicitly (roadmap Phase 1 prod variant).
xpack.security.enabled: false

# Performance settings
bootstrap.memory_lock: true

# Index settings
action.destructive_requires_name: true
indices.query.bool.max_clause_count: 10000

# Logging
logger.level: INFO
