# CerebrOps Filebeat configuration (standalone ELK stack)
#
# Collects Docker container logs (including the CerebrOps app container) and
# ships them to Logstash, which parses/enriches and forwards to Elasticsearch.
# The app writes structured JSON to stdout, so each docker log line is a JSON
# record (or a plain text line that Logstash groks as a fallback).

filebeat.inputs:
- type: container
  enabled: true
  paths:
    - /var/lib/docker/containers/*/*.log
  processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"
      match_source: true

# Ship all containers; filter by container name in Kibana (e.g. container.name:
# cerebrops-app) or add a `condition` here to restrict to the app only.
processors:
- add_host_metadata:
    when.not.contains.tags: forwarded
- add_cloud_metadata: ~

setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

setup.template.name: "cerebrops-logs"
setup.template.pattern: "cerebrops-logs-*"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
