name: CerebrOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anshulbari/cerebrops

# Only one pipeline per ref; cancel superseded runs (keeps main queued so
# releases deploy in order).
concurrency:
  group: cerebrops-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Dev requirements include flake8/pytest/pytest-cov needed below
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,build,dist,.venv,__pycache__,.git
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=venv,build,dist,.venv,__pycache__,.git

    - name: Test with pytest
      run: |
        mkdir -p logs
        PYTHONPATH=. pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --tb=short

    - name: Upload coverage reports
      # Best-effort: only meaningful once a CODECOV_TOKEN is configured
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          # semantic version tags (v1.2.3) when a git tag is pushed
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          # latest only for the default branch
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    needs: [build]
    runs-on: ubuntu-latest
    name: Security Scan + SBOM

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Pin trivy-action to a released tag: floating refs (@master) were the
    # vector for the March 2026 trivy-action supply-chain compromise.
    # For maximum security, replace the tag with the commit SHA of 0.35.0.
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true

    - name: Generate SBOM (SPDX)
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: 'fs'
        format: 'spdx-json'
        output: 'sbom.spdx.json'
        exit-code: '0'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload scan artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          trivy-results.sarif
          sbom.spdx.json

  validate-manifests:
    runs-on: ubuntu-latest
    name: Validate Kubernetes Manifests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl (renders kustomize)
      uses: azure/setup-kubectl@v3

    - name: Render kustomize overlays
      run: |
        mkdir -p rendered
        kubectl kustomize k8s/ > rendered/prod.yaml
        kubectl kustomize k8s/overlays/dev > rendered/dev.yaml
        kubectl kustomize k8s/overlays/staging > rendered/staging.yaml

    - name: Schema validation with kubeconform (k8s 1.29, strict)
      uses: docker://ghcr.io/yannh/kubeconform:v0.6.7-alpine
      with:
        args: -strict -summary -kubernetes-version 1.29.0 /github/workspace/rendered/

    - name: Install polaris (pinned release binary)
      # The upstream setup-polaris action builds a stale download URL (asset
      # is now polaris_<version>_linux_amd64.tar.gz and the release tag is
      # v10.2.2), so its setup step silently installs nothing and the audit
      # step fails with "polaris: command not found". Download directly.
      run: |
        mkdir -p "$RUNNER_TEMP/polaris"
        curl -fsSL -o "$RUNNER_TEMP/polaris.tar.gz" \
          https://github.com/FairwindsOps/polaris/releases/download/v10.2.2/polaris_10.2.2_linux_amd64.tar.gz
        tar -xzf "$RUNNER_TEMP/polaris.tar.gz" -C "$RUNNER_TEMP/polaris"
        chmod +x "$RUNNER_TEMP/polaris/polaris"
        echo "$RUNNER_TEMP/polaris" >> "$GITHUB_PATH"

    - name: Polaris security audit (fail on danger issues or score < 90)
      run: |
        polaris audit --audit-path ./rendered/ \
          --set-exit-code-on-danger --set-exit-code-below-score 90 \
          --format=pretty --color=false

  deploy:
    needs: [test, build, security-scan, validate-manifests]
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # OIDC -> short-lived cloud credentials (no long-lived K8S_TOKEN)

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fail early if OIDC role is not configured
      run: |
        if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
          echo "::error::AWS_ROLE_ARN secret is not configured. See GITHUB_SETUP.md for OIDC setup."
          exit 1
        fi
        if [ -z "${{ secrets.EKS_CLUSTER_NAME }}" ]; then
          echo "::error::EKS_CLUSTER_NAME secret is not configured."
          exit 1
        fi

    # OIDC: GitHub issues a short-lived token for the assumed IAM role. The
    # cluster grants the role access via aws-auth (see GITHUB_SETUP.md).
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: cerebrops-deploy
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl (EKS, TLS verified)
      run: |
        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }} \
          --role-arn ${{ secrets.AWS_ROLE_ARN }}

    - name: Update deployment image
      run: |
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}"
        # Replace only the CerebrOps image tag (busybox etc. stay untouched).
        # The match excludes the leading "image: " so the line stays valid YAML.
        sed -i "s|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main|${IMAGE}|g" k8s/base/deployment.yaml
        sed -i "s|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main|${IMAGE}|g" k8s/base/cronjobs.yaml
        sed -i "s|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main|${IMAGE}|g" k8s/base/backup.yaml

    - name: Ensure session secret key exists (create once, never rotate)
      run: |
        if ! kubectl get secret cerebrops-secrets -n cerebrops \
          -o jsonpath='{.data.secret-key}' 2>/dev/null | grep -q .; then
          kubectl create secret generic cerebrops-secrets \
            --from-literal=secret-key="$(openssl rand -hex 32)" -n cerebrops
        else
          echo "CEREBROPS_SECRET_KEY already present - leaving it untouched"
        fi

    - name: Deploy to Kubernetes
      run: |
        echo "Deploying to Kubernetes cluster..."
        kubectl apply -k k8s/
        kubectl rollout status deployment/cerebrops-app -n cerebrops --timeout=300s

    - name: Run smoke tests
      run: |
        echo "Running post-deployment smoke tests..."
        chmod +x scripts/smoke-tests.sh
        APP_URL="${{ secrets.APP_URL }}" ./scripts/smoke-tests.sh || echo "Smoke tests failed but continuing..."

    - name: Report pipeline success
      if: success()
      env:
        APP_URL: ${{ secrets.APP_URL }}
        CEREBROPS_API_KEY: ${{ secrets.CEREBROPS_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ -n "$APP_URL" ]; then
          curl -s -X POST "$APP_URL/api/v1/pipeline/events" \
            -H 'Content-Type: application/json' ${CEREBROPS_API_KEY:+-H "X-API-Key: $CEREBROPS_API_KEY"} \
            -d '{"pipeline_id":"${{ github.run_id }}","status":"success","stage":"deploy","duration":0,"branch":"${{ github.ref_name }}","commit_hash":"${{ github.sha }}","source":"github-actions"}' \
            && echo "Pipeline success reported" || echo "Pipeline event report skipped"
        else
          echo "APP_URL not set; skipping pipeline event report"
        fi
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚀 CerebrOps deployment completed successfully (main@${{ github.sha }})"}' \
            "$SLACK_WEBHOOK_URL" || echo "Slack notification skipped"
        fi

    - name: Report pipeline failure
      if: failure()
      env:
        APP_URL: ${{ secrets.APP_URL }}
        CEREBROPS_API_KEY: ${{ secrets.CEREBROPS_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ -n "$APP_URL" ]; then
          curl -s -X POST "$APP_URL/api/v1/pipeline/events" \
            -H 'Content-Type: application/json' ${CEREBROPS_API_KEY:+-H "X-API-Key: $CEREBROPS_API_KEY"} \
            -d '{"pipeline_id":"${{ github.run_id }}","status":"failed","stage":"deploy","duration":0,"branch":"${{ github.ref_name }}","commit_hash":"${{ github.sha }}","source":"github-actions"}' \
            && echo "Pipeline failure reported" || echo "Pipeline event report skipped"
        else
          echo "APP_URL not set; skipping pipeline event report"
        fi
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ CerebrOps deployment FAILED (main@${{ github.sha }})"}' \
            "$SLACK_WEBHOOK_URL" || echo "Slack notification skipped"
        fi

  # Anomaly detection intentionally does NOT run in CI - it cannot reach the
  # deployed app from a runner. Real detection runs in-cluster via the
  # cerebrops-anomaly-detection CronJob (k8s/base/cronjobs.yaml), reading the
  # shared metrics store and alerting to Slack directly.
  performance-test:
    needs: build
    runs-on: ubuntu-latest
    name: Performance Testing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start application for testing (built digest)
      run: |
        docker run -d -p 5000:5000 --name cerebrops-test \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        sleep 10

    - name: Run k6 load tests (pinned image)
      run: |
        docker run --rm -i --add-host=host.docker.internal:host-gateway \
          grafana/k6:0.54.0 run --vus 10 --duration 30s - <<'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';

        export const options = {
          thresholds: {
            http_req_failed: ['rate<0.01'],        // < 1% errors
            http_req_duration: ['p(95)<500']       // p95 < 500ms
          }
        };

        export default function () {
          let response = http.get('http://host.docker.internal:5000/');
          check(response, { 'status was 200': (r) => r.status == 200 });

          response = http.get('http://host.docker.internal:5000/health');
          check(response, { 'health check passed': (r) => r.status == 200 });

          response = http.get('http://host.docker.internal:5000/metrics-prom');
          check(response, { 'metrics endpoint working': (r) => r.status == 200 });

          sleep(1);
        }
        EOF

    - name: Cleanup
      if: always()
      run: |
        docker stop cerebrops-test || true
        docker rm cerebrops-test || true
