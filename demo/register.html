<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — CerebrOps Demo</title>
  <link rel="icon" type="image/svg+xml" href="./static/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/tokens.css">
  <link rel="stylesheet" href="./static/css/base.css">
  <link rel="stylesheet" href="./static/css/auth.css">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="auth-brand" href="./index.html">
      <span class="brand-mark" aria-hidden="true">
        <img src="./static/img/logo.svg" alt="" width="26" height="26">
      </span>
      CerebrOps
    </a>

    <h1 class="auth-title">Start <span class="serif-it" style="color:var(--accent-strong)">watching.</span></h1>
    <p class="auth-sub">Every commit, one webhook away from a live record of your deploys.</p>

    <form class="auth-form" id="register-form">
      <div class="auth-field">
        <label for="name">Name</label>
        <input class="auth-input" id="name" name="name" type="text" placeholder="Ada Lovelace" autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" id="email" name="email" type="email" placeholder="you@company.dev" required autocomplete="email" autofocus>
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input class="auth-input" id="password" name="password" type="password" placeholder="at least 8 characters" required autocomplete="new-password">
      </div>
      <button class="auth-submit" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
    <p class="auth-demo">Runs entirely in your cluster. Telemetry never leaves it.</p>

    <p class="auth-foot">
      <a href="./index.html">← back to cerebrops</a>
    </p>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './dashboard.html';
    });
  </script>
</body>
</html>
