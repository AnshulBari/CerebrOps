<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Brain/circuit hybrid: a stylized brain outline with monitoring pulse -->
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7cabff"/>
      <stop offset="100%" stop-color="#4d8dff"/>
    </linearGradient>
  </defs>
  <!-- Outer brain shape - simplified, geometric -->
  <path d="M16 3C10.5 3 6 7 6 12.5c0 3.5 1.8 6.5 4.5 8.2V24c0 1.1.9 2 2 2h7c1.1 0 2-.9 2-2v-3.3c2.7-1.7 4.5-4.7 4.5-8.2C26 7 21.5 3 16 3z" 
        stroke="url(#logoGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Neural pathways / circuit lines inside brain -->
  <path d="M10 12h3l1.5-3 2 6 1.5-3H22" 
        stroke="url(#logoGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Monitoring pulse / detection wave -->
  <path d="M8 18h2l1-2 1.5 4 1-2h3" 
        stroke="#4d8dff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Small dot - represents detection/alert -->
  <circle cx="22" cy="9" r="2" fill="#4d8dff" opacity="0.8"/>
</svg>
