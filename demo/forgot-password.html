<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — CerebrOps Demo</title>
  <link rel="icon" type="image/svg+xml" href="./static/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./static/css/tokens.css">
  <link rel="stylesheet" href="./static/css/base.css">
  <link rel="stylesheet" href="./static/css/auth.css">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="auth-brand" href="./index.html">
      <span class="brand-mark" aria-hidden="true">
        <img src="./static/img/logo.svg" alt="" width="26" height="26">
      </span>
      CerebrOps
    </a>

    <h1 class="auth-title">Lost your <span class="serif-it" style="color:var(--accent-strong)">keys?</span></h1>
    <p class="auth-sub">Enter your account email and we'll issue a single-use reset link. It expires in 30 minutes.</p>

    <div class="auth-note" role="status" id="reset-note" style="display:none">
      <span class="mono" style="font-size:12px">Reset link sent! (Demo mode — no email actually sent)</span>
    </div>

    <form class="auth-form" id="reset-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input class="auth-input" id="email" name="email" type="email" placeholder="you@company.dev" required autocomplete="email" autofocus>
      </div>
      <button class="auth-submit" type="submit">Send reset link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="./login.html">Sign in</a></p>

    <p class="auth-foot">
      <a href="./index.html">← back to cerebrops</a>
    </p>
  </main>

  <script>
    document.getElementById('reset-form').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('reset-note').style.display = 'block';
      document.getElementById('reset-form').style.display = 'none';
    });
  </script>
</body>
</html>
